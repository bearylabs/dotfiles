set -g mouse on

# tmux composes its own output from the panes, so a pane claiming 24-bit colour
# is only honoured if tmux believes the outer terminal speaks it too, and it
# will not assume that of xterm-256color. Without this, truecolor from
# `emacs -nw' is quantised back to 256 colours on the way out.
#
# Only RGB needs saying: tmux 3.7 already defaults default-terminal to
# tmux-256color and already infers the cstyle feature (DECSCUSR, the evil
# block/bar cursor) for xterm-like terminals.
set -as terminal-features ",*:RGB"
