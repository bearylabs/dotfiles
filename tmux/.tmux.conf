set -g mouse on

# tmux composes its own output from the panes, so a pane claiming 24-bit colour
# is only honoured if tmux believes the outer terminal speaks it too, and it
# will not assume that of xterm-256color. Without this, truecolor from
# `emacs -nw' is quantised back to 256 colours on the way out.
#
# Only RGB needs saying: tmux 3.7 already defaults default-terminal to
# tmux-256color and already infers the cstyle feature (DECSCUSR, the evil
# block/bar cursor) for xterm-like terminals.
set -as terminal-features ",*:RGB"

# C-a as a second prefix, with C-b still bound as the first. `send-prefix -2'
# is what keeps C-a itself reachable in the pane: C-a C-a emits a literal C-a,
# which emacs -nw and readline both want for beginning-of-line.
set -g prefix2 C-a
bind C-a send-prefix -2

# Reload on prefix+r, the same key Herdr uses. Displaces the stock refresh-client
# binding, which `tmux refresh-client' still covers from the command prompt.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
