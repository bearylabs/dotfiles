; Polybar port of the zebar "my-bar" widget from bearylabs/glazewm-config.
;
; Colours, metrics, refresh intervals and warning thresholds are carried over
; from that widget's CSS and provider setup so both machines read the same.
; Where polybar has no equivalent -- hover states, tooltips, rounded corners --
; the resting appearance is kept and the effect is dropped.
;
; Icons come from Symbols Nerd Font; the widget's inline SVGs have no direct
; counterpart, so the closest Material Design / Codicon glyph stands in.

; ---------------------------------------------------------------- palette --
; Catppuccin Mocha, same names as the CSS custom properties.

[colors]
crust     = #11111b
mantle    = #181825
base      = #1e1e2e
surface0  = #313244
surface1  = #45475a
surface2  = #585b70
overlay0  = #6c7086
overlay1  = #7f849c
subtext0  = #a6adc8
subtext1  = #bac2de
text      = #cdd6f4
lavender  = #b4befe
blue      = #89b4fa
sapphire  = #74c7ec
teal      = #94e2d5
green     = #a6e3a1
yellow    = #f9e2af
peach     = #fab387
red       = #f38ba8
mauve     = #cba6f7

; -------------------------------------------------------------------- bar --

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
bottom = false

; The widget pins its clock to the middle of the bar rather than to the space
; left between the side zones, so it never shifts when a workspace appears.
fixed-center = true

background = ${colors.crust}
foreground = ${colors.text}

; Gaps are set per module with %{O<px>} offsets, so the bar itself adds none.
padding = 0
module-margin = 0
separator =

; font-0 (%{T1}) text, font-2 (%{T3}) semibold text, font-3 (%{T4}) box drawing
; -- Inter has no U+2502 and the Nerd Font symbol set does not carry one
; either.
;
; Icons come in two sizes. font-1 (%{T2}) is for the controls -- the split
; button and the power row -- which the widget draws larger than its readouts.
; font-4 (%{T5}) is for the readouts themselves, where the glyph labels a
; number rather than standing on its own as a button.
font-0 = Inter:pixelsize=12;3
font-1 = Symbols Nerd Font Mono:pixelsize=13;3
font-2 = Inter:style=SemiBold:pixelsize=12;3
font-3 = JetBrainsMono Nerd Font:pixelsize=12;3
font-4 = Symbols Nerd Font Mono:pixelsize=11;3

modules-left = split workspaces i3mode
modules-center = datetime
modules-right = volume network cpu memory battery powersep powermenu

cursor-click = pointer
enable-ipc = true

; Leave the window managed so i3 reserves the strut for it.
override-redirect = false

; ------------------------------------------------------------- left zone --

; Which way the next window opens, or that the focused one is fullscreen.
; Event driven off the i3 IPC subscription rather than polled.
[module/split]
type = custom/script
exec = $HOME/.config/polybar/scripts/split.sh
tail = true

; The widget's workspace pills, minus the 5px corner radius polybar cannot
; draw. i3 destroys empty workspaces, so "unfocused" here is the widget's
; "has windows but not focused" state.
[module/workspaces]
type = internal/i3
format = <label-state>
index-sort = true
pin-workspaces = true
enable-click = true
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
fuzzy-match = false

label-separator = %{O2}

label-focused = %name%
label-focused-foreground = ${colors.lavender}
label-focused-background = ${colors.surface0}
label-focused-font = 3
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding = 2

; Visible on another output. The widget has no such state -- i3 does -- so it
; sits one step brighter than an ordinary background workspace.
label-visible = %name%
label-visible-foreground = ${colors.subtext1}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

; Active binding mode, e.g. "resize". Renders as nothing in the default mode,
; leaving only the 8px gap that would have preceded it.
[module/i3mode]
type = internal/i3
format = <label-mode>
label-mode = %{O8}%mode%
label-mode-foreground = ${colors.peach}
label-mode-font = 3

; ----------------------------------------------------------- centre zone --

; One module drives both readouts so the pair is centred as a unit.
[module/datetime]
type = internal/date
interval = 1
time = %H:%M
date = %Y.%m.%d
format = <label>
label = %{T5}%{F#89b4fa}󰅐%{F-}%{T-}%{O6}%time%%{O12}%{T4}%{F#45475a}│%{F-}%{T-}%{O12}%{T5}%{F#cba6f7}󰭦%{F-}%{T-}%{O6}%date%

; ------------------------------------------------------------ right zone --

; Not part of the zebar bar -- Windows keeps volume in the shell tray -- but
; carried over from the i3status setup it replaces.
[module/volume]
type = internal/pulseaudio
interval = 5
format-volume = <label-volume>
label-volume = %{O8}%{T5}%{F#f9e2af}󰕾%{F-}%{T-}%{O5}%{F#a6adc8}%percentage:3%%%{F-}
format-muted = <label-muted>
label-muted = %{O8}%{T5}%{F#6c7086}󰝟%{F-}%{T-}%{O5}%{F#6c7086}  0%%{F-}
click-right = pavucontrol

; Link type, signal or negotiated rate, and the address -- see scripts/net.sh.
[module/network]
type = custom/script
exec = $HOME/.config/polybar/scripts/net.sh
interval = 5

[module/cpu]
type = custom/script
exec = $HOME/.config/polybar/scripts/load.sh cpu
tail = true

[module/memory]
type = custom/script
exec = $HOME/.config/polybar/scripts/load.sh mem
tail = true

; Renders nothing on a machine without a battery, rather than a dead 0%.
[module/battery]
type = custom/script
exec = $HOME/.config/polybar/scripts/battery.sh
interval = 15

[module/powersep]
type = custom/text
format = %{O14}%{T4}%{F#45475a}│%{F-}%{T-}

; Lock / log out / shut down, with the widget's inline confirmation. Polybar
; modules hold no state, so the two rows are two IPC hooks and the buttons
; switch between them.
[module/powermenu]
type = custom/ipc
initial = 1
hook-0 = $HOME/.config/polybar/scripts/power.sh menu
hook-1 = $HOME/.config/polybar/scripts/power.sh confirm logout
hook-2 = $HOME/.config/polybar/scripts/power.sh confirm shutdown

; vim:ft=dosini
