# Portable development tools. System services, shells and low-level utilities
# stay in Nix; runtimes and developer CLIs live here.
[settings]
# nix-ld is enabled in both NixOS configurations, so mise can use upstream
# precompiled binaries instead of compiling Node.js and Python from source.
node.compile = false
python.compile = false
minimum_release_age = "0s"
[tools]
# Editors and runtimes
neovim = "latest"
node = "lts"
bun = "latest"
python = "3.13"
uv = "latest"
pipx = "latest"
rust = "stable"
powershell-core = "latest"

# Cloud and infrastructure
aws-cli = "latest"
azure = "latest"
# The registry's vfox plugin cannot see mise's Python during installation.
# Installing the official PyPI package through pipx avoids that plugin.
"pipx:oci-cli" = "latest"
terraform = "latest"
terraform-ls = "latest"
ansible = "latest"

# Kubernetes
kubectl = "latest"
kubeseal = "latest"
helm = "latest"
argocd = "latest"
kubectx = "latest"
k9s = "latest"

# Developer CLI tools
ripgrep = "latest"
fd = "latest"
fzf = "latest"
tree-sitter = "latest"
shellcheck = "latest"
shfmt = "latest"
lazygit = "latest"
btop = "latest"
starship = "latest"

# Language servers and formatters distributed through npm
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"
"npm:yaml-language-server" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"

# AI/development agents
claude = "latest"
codex = "latest"
copilot = "latest"
herdr = "latest"
pi = "latest"

[tasks."azure:extensions"]
description = "Install the Azure CLI extensions used by this setup"
run = "az extension add --name virtual-network-manager --upgrade"

# Run through `mise run --cd ~/dotfiles` so paths resolve against the repository.
[tasks."pi:extensions"]
description = "Install locked dev dependencies for the Pi extensions in this repository"
dir = "{{cwd}}"
run = """
set -eu
for manifest in stow/pi/.pi/agent/extensions/*/package.json; do
  [ -e "$manifest" ] || { echo "no Pi extension manifests below $PWD" >&2; exit 1; }
  extension="${manifest%/package.json}"
  echo "npm ci: $extension"
  npm ci --prefix "$extension" --ignore-scripts --no-audit --no-fund --loglevel=error
done
"""

[tasks."pi:extensions:check"]
description = "Typecheck and test the Pi extensions in this repository"
depends = ["pi:extensions"]
dir = "{{cwd}}"
run = """
set -eu
for manifest in stow/pi/.pi/agent/extensions/*/package.json; do
  extension="${manifest%/package.json}"
  echo "npm run check: $extension"
  npm run --prefix "$extension" check
done
"""
